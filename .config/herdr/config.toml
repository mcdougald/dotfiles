# -----------------------------------------------------------------------------
# UI — 0.8.0 styled sidebar, reclaim chrome, click-to-jump toasts.
# -----------------------------------------------------------------------------
[ui]
sidebar_width = 32
sidebar_min_width = 22
sidebar_max_width = 44
sidebar_start_collapsed = false
sidebar_collapsed_mode = "compact"
mobile_width_threshold = 72
mouse_capture = true
copy_on_select = true
host_cursor = "auto"
right_click_passthrough_modifier = "ctrl"
redraw_on_focus_gained = true
mouse_scroll_lines = 3
confirm_close = true
prompt_new_tab_name = false
prompt_new_workspace_name = true
pane_borders = true
pane_scrollbars = false
pane_gaps = true
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
tab_bar_position = "top"
agent_panel_sort = "priority"
accent = "#7aa2f7"

# Tokyo Night token colors. Unreported $summary / $model rows disappear.
[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "agent", bold = true }, { token = "state_text", fg = "#e0af68" }],
  [{ token = "$summary", fg = "#7dcfff", bold = true }],
  ["workspace", "tab", "pane"],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "agent", bold = true }, { token = "state_text", fg = "#e0af68" }],
  [{ token = "terminal_title_stripped", fg = "#7dcfff" }],
  [{ token = "$summary", fg = "#bb9af7" }],
  ["workspace", "tab", "pane"],
]
codex = [
  ["state_icon", { token = "agent", bold = true }, { token = "state_text", fg = "#e0af68" }],
  [{ token = "terminal_title_stripped", fg = "#7dcfff" }],
  [{ token = "$summary", fg = "#bb9af7" }],
  ["workspace", "tab", "pane"],
]
cursor = [
  ["state_icon", { token = "agent", bold = true }, { token = "state_text", fg = "#e0af68" }],
  [{ token = "terminal_title_stripped", fg = "#7dcfff" }],
  [{ token = "$summary", fg = "#bb9af7" }],
  ["workspace", "tab", "pane"],
]
copilot = [
  ["state_icon", { token = "agent", bold = true }, { token = "state_text", fg = "#e0af68" }],
  [{ token = "terminal_title_stripped", fg = "#7dcfff" }],
  [{ token = "$summary", fg = "#bb9af7" }],
  ["workspace", "tab", "pane"],
]
gemini = [
  ["state_icon", { token = "agent", bold = true }, { token = "state_text", fg = "#e0af68" }],
  [{ token = "terminal_title_stripped", fg = "#7dcfff" }],
  ["workspace", "tab", "pane"],
]
agy = [
  ["state_icon", { token = "agent", bold = true }, { token = "state_text", fg = "#e0af68" }],
  [{ token = "terminal_title_stripped", fg = "#7dcfff" }],
  ["workspace", "tab", "pane"],
]
opencode = [
  ["state_icon", { token = "agent", bold = true }, { token = "state_text", fg = "#e0af68" }],
  [{ token = "terminal_title_stripped", fg = "#7dcfff" }],
  ["workspace", "tab", "pane"],
]
pi = [
  ["state_icon", { token = "agent", bold = true }, { token = "state_text", fg = "#e0af68" }],
  [{ token = "terminal_title_stripped", fg = "#7dcfff" }],
  [{ token = "$summary", fg = "#bb9af7" }],
  ["workspace", "tab", "pane"],
]
grok = [
  ["state_icon", { token = "agent", bold = true }, { token = "state_text", fg = "#e0af68" }],
  [{ token = "terminal_title_stripped", fg = "#7dcfff" }],
  ["workspace", "tab", "pane"],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", bold = true }, { token = "state_text", fg = "#e0af68" }],
  ["branch", "git_status"],
]

# In-app toasts: click jumps to the pane. Over SSH use delivery = "terminal".
# Detached machines: delivery = "system" + brew install terminal-notifier.
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = true

[ui.sound.agents]
droid = "off"
claude = "on"
codex = "on"
cursor = "on"
github_copilot = "on"
gemini = "on"
open_code = "on"
pi = "on"
grok = "on"
agy = "on"
kimi = "on"
hermes = "on"
